# grepx-split: LifeFlow Blood Camp on the GrepX platform.
#   ./setup.sh                          once: the orchestrator's own venv
#   ./run.sh -p grepx-blood-donation    clone/update all four repos next to each other, build Nexus, set up, migrate, start
#   ./run.sh -p grepx-blood-donation --fetch-only    only clone/update the repos
# The project is the workspace; its workspace.sh links the dependency repos in (they sit next to it: `dir:`).
projects:
  grepx-blood-donation:
    url: git@github.com:grepx-support/grepx-blood-donation.git
    branch: main
    dependencies:
      - grepx-platform
      - grepx-services
      - grepx-nexus-cpp
    deploy: ./deploy.sh --no-pull            # the orchestrator already pulled every repo
    env:
      SKIP_INFRA: "0"                        # 1 = toolchain + database engines already installed
dependencies:
  grepx-platform:
    url: git@github.com:grepx-support/grepx-platform.git
    branch: main
    dir: grepx-platform
  grepx-services:
    url: git@github.com:grepx-support/grepx-services.git
    branch: main
    dir: grepx-services
  grepx-nexus-cpp:
    url: git@github.com:grepx-support/grepx-nexus-cpp.git
    branch: refactor
    dir: grepx-nexus-cpp
